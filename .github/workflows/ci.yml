name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip (meson)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-meson-${{ runner.os }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "apt retry $i"; sleep 15; }
          done
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            ninja-build
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure (${{ matrix.cc }})
        env:
          CC: ${{ matrix.cc }}
        run: meson setup build --werror

      - name: Compile (${{ matrix.cc }})
        run: ninja -C build

      - name: Test (${{ matrix.cc }})
        run: meson test -C build --print-errorlogs


  plain-make:
    # The path a user takes: no Meson, just a compiler, make and libcurl.
    name: Plain make (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install libcurl (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "apt retry $i"; sleep 15; }
          done
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      - name: Check dependencies
        run: sh scripts/check-deps.sh

      - name: make (warnings are errors here, never for users)
        run: make -j4 CFLAGS="-O2 -g -Werror"

      - name: make test (Linux)
        if: runner.os == 'Linux'
        run: make test

      - name: make TUI=0 SHARED=0 (Linux)
        if: runner.os == 'Linux'
        run: make -j4 O=build/minimal TUI=0 SHARED=0 CFLAGS="-O2 -Werror" && build/minimal/puci --version

      - name: install, embed via pkg-config, uninstall
        run: |
          P="$RUNNER_TEMP/prefix"
          make install PREFIX="$P"
          "$P/bin/puci" --version
          export PKG_CONFIG_PATH="$P/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cc -std=c17 examples/minimal_agent.c $(pkg-config --cflags --libs puci) \
             -Wl,-rpath,"$P/lib" -o "$RUNNER_TEMP/minimal_shared"
          cc -std=c17 examples/minimal_agent.c $(pkg-config --cflags puci) "$P/lib/libpuci.a" \
             $(pkg-config --libs libcurl 2>/dev/null || curl-config --libs) -pthread \
             -o "$RUNNER_TEMP/minimal_static"
          make uninstall PREFIX="$P"
          left=$(find "$P" -type f -o -type l | wc -l)
          test "$left" -eq 0 || { echo "uninstall left $left files"; find "$P"; exit 1; }

      - name: DESTDIR staging (packagers)
        run: |
          make install DESTDIR="$RUNNER_TEMP/stage" PREFIX=/usr
          grep -q '^prefix=/usr$' "$RUNNER_TEMP/stage/usr/lib/pkgconfig/puci.pc"
          test -x "$RUNNER_TEMP/stage/usr/bin/puci"

  sanitizer:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip (meson)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-meson-${{ runner.os }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "apt retry $i"; sleep 15; }
          done
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            ninja-build
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure with sanitizers
        env:
          CC: clang
        run: meson setup build-san --werror -Db_sanitize=address,undefined -Db_lundef=false

      - name: Compile
        run: ninja -C build-san

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: meson test -C build-san --print-errorlogs --timeout-multiplier 3

  bench:
    name: Swarm density benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip (meson)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-meson-${{ runner.os }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "apt retry $i"; sleep 15; }
          done
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            ninja-build
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure benchmark build
        run: meson setup build-bench -Dbench=true

      - name: Build benchmark
        run: ninja -C build-bench bench/bench_swarm

      - name: Run 100-agent density check
        run: ./build-bench/bench/bench_swarm 100
