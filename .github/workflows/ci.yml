name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip (meson)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-meson-${{ runner.os }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "apt retry $i"; sleep 15; }
          done
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            ninja-build
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure (${{ matrix.cc }})
        env:
          CC: ${{ matrix.cc }}
        run: meson setup build --werror

      - name: Compile (${{ matrix.cc }})
        run: ninja -C build

      - name: Test (${{ matrix.cc }})
        run: meson test -C build --print-errorlogs

  sanitizer:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip (meson)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-meson-${{ runner.os }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "apt retry $i"; sleep 15; }
          done
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            ninja-build
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure with sanitizers
        env:
          CC: clang
        run: meson setup build-san --werror -Db_sanitize=address,undefined -Db_lundef=false

      - name: Compile
        run: ninja -C build-san

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: meson test -C build-san --print-errorlogs --timeout-multiplier 3

  bench:
    name: Swarm density benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip (meson)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-meson-${{ runner.os }}

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "apt retry $i"; sleep 15; }
          done
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            ninja-build
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure benchmark build
        run: meson setup build-bench -Dbench=true

      - name: Build benchmark
        run: ninja -C build-bench bench/bench_swarm

      - name: Run 100-agent density check
        run: ./build-bench/bench/bench_swarm 100
