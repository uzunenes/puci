name: Release

# Push a tag like v0.6.0 to build prebuilt binaries and attach them to a
# GitHub Release. Binaries link libpuci statically and libcurl dynamically
# (libcurl.so.4 ships with virtually every Linux distribution). Built on the
# oldest supported Ubuntu runner so the glibc requirement stays low.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "apt retry $i"; sleep 15; }
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential libcurl4-openssl-dev pkg-config python3

      - name: Build
        run: make -j4 CFLAGS="-O2"

      - name: Test
        run: make test

      - name: Package
        id: pkg
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || ver="$(git describe --always)"
          name="puci-${ver}-${{ matrix.target }}"
          mkdir -p "dist/$name/bin"
          install -m 755 build/make/puci "dist/$name/bin/puci"
          strip "dist/$name/bin/puci"
          mkdir -p "dist/$name/man/man1"
          cp man/puci.1 "dist/$name/man/man1/"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          "dist/$name/bin/puci" --version
          ldd "dist/$name/bin/puci"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  source:
    name: Source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make dist
        run: |
          make dist
          cd build/make && sha256sum puci-*.tar.gz > "$(ls puci-*.tar.gz).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            build/make/puci-*.tar.gz
            build/make/puci-*.tar.gz.sha256

  release:
    name: Publish release
    needs: [build, source]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
